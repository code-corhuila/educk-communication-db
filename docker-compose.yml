version: '3.8'

services:
  # Pattern: <abbr>-<domain>-<piece> -> educk-comm-db
  postgres-db:
    image: postgres:16-alpine
    container_name: educk-comm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be defined in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be defined in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      edutrack-net:
        aliases:
          - educk-comm-db
          - postgres-db

volumes:
  pgdata:

networks:
  edutrack-net:
    driver: bridge
